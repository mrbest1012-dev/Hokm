name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare
        run: |
          mkdir www
          cp hokm-single.html www/index.html
          npm init -y
          npm i --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 capacitor-zeroconf
          capacitor-udp-socket
          npx cap init Hokm com.example.hokm --web-dir www
          npx cap add android
          npx cap sync
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/><uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/><application#' $M
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' $M
      - name: Build
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hokm-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
